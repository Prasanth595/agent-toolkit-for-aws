name: Startup advisor

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/aws-startup-advisor/**"
      - "mise.toml"
      - ".github/workflows/startup-advisor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-advisor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          working_directory: plugins/aws-startup-advisor
      - name: Run startup advisor checks
        run: mise -C plugins/aws-startup-advisor run ci
