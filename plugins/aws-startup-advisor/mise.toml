[tasks.ci]
description = "Run startup advisor CI checks"
depends = ["lint:model-id", "lint:startup-model-pricing", "test"]

[tasks."lint:model-id"]
description = "Check model references against the lifecycle registry"
run = "uv run --no-project python scripts/model-id-lint.py"

[tasks."lint:startup-model-pricing"]
description = "Validate model pricing coverage"
run = "uv run --no-project python scripts/validate-model-pricing.py"

[tasks.test]
description = "Run plugin contract tests"
run = "uv run --no-project --with pytest python -m pytest tests -q"
