[tasks."lint:artifacts"]
description = "Validate aws-startup-advisor fixture artifacts against their published schema contracts"
run = "python3 scripts/validate-artifacts.py --fixtures"

[tasks.ci]
description = "Run startup advisor CI checks"
depends = ["lint:model-id", "lint:artifacts", "test", "test:heroku-source-review"]

[tasks."lint:model-id"]
description = "Check model references against the lifecycle registry"
run = "uv run --no-project python scripts/model-id-lint.py"

[tasks.test]
description = "Run plugin contract tests"
run = "uv run --no-project --with pytest python -m pytest tests -q"

[tasks."test:heroku-source-review"]
description = "Run Heroku application-source contract and validator tests"
run = [
  "node --test tests/tools/application-source-contract.test.ts",
  "node --test tests/tools/application-source-review.test.ts",
]
